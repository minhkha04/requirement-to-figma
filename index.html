<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>AI Assistant Chat</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Orbitron", "Space Mono", monospace;
            background: #0a0a0f;
            background-image:
                radial-gradient(circle at 25% 25%, #1a0033 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, #000d1a 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #001122 0%, transparent 50%);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e7ff;
            position: relative;
            overflow: hidden;
        }

        /* Animated Stars Background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, #ff4d6d, transparent),
                radial-gradient(1px 1px at 90px 40px, #c084fc, transparent),
                radial-gradient(1px 1px at 130px 80px, #06b6d4, transparent),
                radial-gradient(2px 2px at 160px 30px, #fbbf24, transparent),
                radial-gradient(1px 1px at 200px 90px, #8b5cf6, transparent),
                radial-gradient(2px 2px at 250px 50px, #10b981, transparent),
                radial-gradient(1px 1px at 300px 20px, #f97316, transparent);
            background-repeat: repeat;
            background-size: 350px 150px;
            animation: sparkle 20s linear infinite;
            opacity: 0.7;
            z-index: 1;
        }

        @keyframes sparkle {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-350px);
            }
        }

        /* Nebula Effect */
        body::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at center, rgba(139, 92, 246, 0.1) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 20%, rgba(236, 72, 153, 0.1) 0%, transparent 70%),
                radial-gradient(ellipse at 20% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 70%);
            animation: nebulaFloat 30s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes nebulaFloat {

            0%,
            100% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.1);
            }
        }

        .container {
            width: 96%;
            max-width: 1400px;
            height: 92vh;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 2px solid rgba(139, 92, 246, 0.3);
            box-shadow:
                0 0 80px rgba(139, 92, 246, 0.4),
                0 0 40px rgba(6, 182, 212, 0.3),
                inset 0 0 40px rgba(15, 23, 42, 0.5);
            display: flex;
            overflow: hidden;
            animation: containerGlow 4s ease-in-out infinite alternate;
            position: relative;
            z-index: 10;
        }

        @keyframes containerGlow {
            from {
                box-shadow:
                    0 0 80px rgba(139, 92, 246, 0.4),
                    0 0 40px rgba(6, 182, 212, 0.3),
                    inset 0 0 40px rgba(15, 23, 42, 0.5);
            }

            to {
                box-shadow:
                    0 0 120px rgba(139, 92, 246, 0.6),
                    0 0 60px rgba(6, 182, 212, 0.5),
                    inset 0 0 40px rgba(15, 23, 42, 0.5);
            }
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            display: flex;
            flex-direction: column;
            border-right: 2px solid rgba(139, 92, 246, 0.3);
            position: relative;
            backdrop-filter: blur(15px);
        }

        .sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg,
                    rgba(139, 92, 246, 0.8),
                    rgba(6, 182, 212, 0.6),
                    rgba(236, 72, 153, 0.8));
            animation: borderPulse 3s ease-in-out infinite;
        }

        @keyframes borderPulse {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .sidebar-header {
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%);
            color: #fff;
            padding: 20px;
            font-weight: 700;
            text-align: center;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.5);
        }

        .sidebar-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: cosmicShimmer 4s infinite;
        }

        @keyframes cosmicShimmer {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .new-btn {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #3b82f6 100%);
            color: #fff;
            border: none;
            margin: 16px;
            padding: 14px 20px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                0 8px 32px rgba(236, 72, 153, 0.4),
                0 0 20px rgba(139, 92, 246, 0.3);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }

        .new-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }

        .new-btn:hover::before {
            left: 100%;
        }

        .new-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow:
                0 12px 40px rgba(236, 72, 153, 0.6),
                0 0 30px rgba(139, 92, 246, 0.5);
        }

        .new-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
            scrollbar-width: thin;
            scrollbar-color: rgba(139, 92, 246, 0.5) transparent;
        }

        .conversation-list::-webkit-scrollbar {
            width: 8px;
        }

        .conversation-list::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 4px;
        }

        .conversation-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #8b5cf6, #06b6d4);
            border-radius: 4px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .conversation-item {
            padding: 16px;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.6);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            backdrop-filter: blur(10px);
            font-weight: 500;
            color: #e2e8f0;
            position: relative;
            overflow: hidden;
            font-family: 'Space Mono', monospace;
        }

        .conversation-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.2), transparent);
            transition: left 0.4s;
        }

        .conversation-item:hover::before {
            left: 100%;
        }

        .conversation-item:hover {
            background: rgba(30, 41, 59, 0.8);
            transform: translateX(8px);
            box-shadow:
                0 8px 32px rgba(139, 92, 246, 0.3),
                0 0 20px rgba(6, 182, 212, 0.2);
            border-color: rgba(139, 92, 246, 0.6);
        }

        .conversation-item.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.8) 0%, rgba(59, 130, 246, 0.6) 100%);
            color: white;
            font-weight: 700;
            transform: translateX(8px);
            box-shadow:
                0 12px 40px rgba(139, 92, 246, 0.6),
                0 0 30px rgba(59, 130, 246, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.8) 100%);
            position: relative;
            backdrop-filter: blur(15px);
        }

        .chat-header {
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%);
            color: white;
            padding: 20px 24px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow:
                0 8px 32px rgba(139, 92, 246, 0.4),
                0 0 20px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Orbitron', monospace;
        }

        .chat-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg,
                    rgba(139, 92, 246, 0.8),
                    rgba(59, 130, 246, 0.6),
                    rgba(6, 182, 212, 0.8));
            animation: headerGlow 3s ease-in-out infinite;
        }

        @keyframes headerGlow {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        #figmaBtn {
            background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #8b5cf6 100%);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                0 6px 20px rgba(245, 158, 11, 0.4),
                0 0 15px rgba(236, 72, 153, 0.3);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }

        #figmaBtn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }

        #figmaBtn:hover::before {
            left: 100%;
        }

        #figmaBtn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow:
                0 10px 30px rgba(245, 158, 11, 0.6),
                0 0 25px rgba(236, 72, 153, 0.5);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            list-style: none;
            display: flex;
            flex-direction: column;
            background: transparent;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: rgba(139, 92, 246, 0.5) transparent;
        }

        .chat-box::-webkit-scrollbar {
            width: 8px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 4px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #8b5cf6, #06b6d4);
            border-radius: 4px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .chat-box li {
            margin: 0;
            padding: 18px 22px;
            border-radius: 20px;
            max-width: 75%;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            animation: messageSlideIn 0.5s ease-out;
            font-weight: 500;
            font-family: 'Space Mono', monospace;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .chat-box li.user {
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%);
            color: white;
            align-self: flex-end;
            text-align: right;
            box-shadow:
                0 8px 32px rgba(139, 92, 246, 0.4),
                0 0 20px rgba(59, 130, 246, 0.3);
            border-bottom-right-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-box li.user::before {
            content: '';
            position: absolute;
            bottom: 0;
            right: -10px;
            width: 0;
            height: 0;
            border-left: 10px solid #06b6d4;
            border-top: 10px solid transparent;
        }

        .chat-box li.user::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6, #06b6d4);
            border-radius: 20px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .chat-box li.user:hover::after {
            opacity: 0.3;
        }

        .chat-box li.system {
            background: rgba(30, 41, 59, 0.8);
            color: #e2e8f0;
            align-self: flex-start;
            border: 1px solid rgba(139, 92, 246, 0.3);
            backdrop-filter: blur(15px);
            box-shadow:
                0 8px 32px rgba(30, 41, 59, 0.4),
                0 0 20px rgba(139, 92, 246, 0.2);
            border-bottom-left-radius: 6px;
        }

        .chat-box li.system::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: -10px;
            width: 0;
            height: 0;
            border-right: 10px solid rgba(30, 41, 59, 0.8);
            border-top: 10px solid transparent;
        }

        .chat-input {
            display: flex;
            border-top: 2px solid rgba(139, 92, 246, 0.3);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            padding: 20px 24px;
            gap: 16px;
            position: relative;
        }

        .chat-input::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg,
                    rgba(139, 92, 246, 0.8),
                    rgba(59, 130, 246, 0.6),
                    rgba(6, 182, 212, 0.8));
            animation: inputGlow 3s ease-in-out infinite;
        }

        @keyframes inputGlow {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .chat-input input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            outline: none;
            font-size: 15px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(15px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Space Mono', monospace;
            color: #e2e8f0;
            font-weight: 500;
        }

        .chat-input input::placeholder {
            color: rgba(226, 232, 240, 0.6);
        }

        .chat-input input:focus {
            border-color: #8b5cf6;
            box-shadow:
                0 0 0 4px rgba(139, 92, 246, 0.2),
                0 0 20px rgba(139, 92, 246, 0.4);
            background: rgba(30, 41, 59, 0.9);
        }

        .chat-input input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-input button {
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%);
            color: white;
            border: none;
            padding: 16px 28px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                0 8px 32px rgba(139, 92, 246, 0.4),
                0 0 20px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Orbitron', monospace;
        }

        .chat-input button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }

        .chat-input button:hover::before {
            left: 100%;
        }

        .chat-input button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow:
                0 12px 40px rgba(139, 92, 246, 0.6),
                0 0 30px rgba(59, 130, 246, 0.5);
        }

        .chat-input button:active {
            transform: translateY(-1px) scale(1.02);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 280px;
            }

            .container {
                width: 98%;
                height: 95vh;
                border-radius: 16px;
            }

            .chat-box li {
                max-width: 85%;
            }

            .chat-header {
                font-size: 16px;
                padding: 16px 20px;
            }
        }

        @media (max-width: 600px) {
            body::before {
                background-size: 300px 120px;
            }

            .sidebar {
                display: none;
            }

            .chat-input {
                flex-direction: column;
                gap: 12px;
                padding: 16px;
            }

            .chat-input button {
                padding: 14px;
            }

            .chat-box {
                padding: 16px;
            }
        }

        /* Custom Cosmic Loading Animation */
        @keyframes cosmicPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        .cosmic-glow {
            animation: cosmicPulse 2s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">🌌 Cosmic Conversations</div>
            <button class="new-btn" onclick="createConversation()">⭐ New Stellar Chat</button>
            <div id="conversationList" class="conversation-list"></div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div id="chatHeader" class="chat-header">
                <span id="chatTitle">🚀 Select a stellar conversation to begin</span>
                <button id="figmaBtn">🛸 Generate Cosmic Layout</button>
            </div>

            <ul id="chat" class="chat-box"></ul>
            <div class="chat-input">
                <input id="msg" type="text" placeholder="🌟 Type your cosmic message..." disabled />
                <button onclick="sendMsg()">🚀 Launch</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io("http://localhost:8080");
        let conversationId = null;
        let currentTitle = null;

        socket.on("connect", () => {
            console.log("✅ Socket connected:", socket.id);
        });

        // Thêm tin nhắn vào khung chat
        function addMessage(text, sender = "system") {
            const li = document.createElement("li");
            li.textContent = text;
            li.classList.add(sender);
            const chatBox = document.getElementById("chat");
            chatBox.appendChild(li);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Tải danh sách conversation
        function loadConversations() {
            axios.get("http://localhost:8080/api/conversations")
                .then(res => {
                    const list = document.getElementById("conversationList");
                    list.innerHTML = "";
                    res.data.data.conversations.forEach(conv => {
                        const div = document.createElement("div");
                        div.classList.add("conversation-item");
                        div.textContent = conv.title;
                        div.onclick = (e) => selectConversation(conv, e);
                        list.appendChild(div);
                    });
                })
                .catch(err => {
                    console.error("❌ Lỗi tải conversations:", err);
                });
        }

        // Chọn conversation
        function selectConversation(conv, e) {
            conversationId = conv._id;
            currentTitle = conv.title;

            document.getElementById("chatTitle").textContent = conv.title;
            document.getElementById("figmaBtn").style.display = "inline-block"; // hiển nút Figma

            // highlight conversation đang chọn
            document.querySelectorAll(".conversation-item").forEach(i => i.classList.remove("active"));
            if (e && e.target) e.target.classList.add("active");

            // reset chat
            document.getElementById("chat").innerHTML = "";
            document.getElementById("msg").disabled = false;

            socket.emit("join_room", conversationId);

            // load messages
            axios.get(`http://localhost:8080/api/messages/${conversationId}`)
                .then(res => {
                    const messages = res.data.data.messages;
                    messages.forEach(m => addMessage(m.text, m.sender));
                })
                .catch(err => {
                    console.error("❌ Lỗi tải messages:", err);
                });
        }

        // Tạo mới conversation
        function createConversation() {
            const title = prompt("Nhập tiêu đề cuộc trò chuyện:");
            if (!title) return;

            axios.post("http://localhost:8080/api/conversations", { title })
                .then(res => {
                    const { conversation } = res.data.data;
                    loadConversations();
                    selectConversation(conversation, null);
                })
                .catch(err => {
                    console.error("❌ Lỗi tạo conversation:", err);
                    alert("Không thể tạo cuộc trò chuyện mới!");
                });
        }

        // Gửi tin nhắn
        function sendMsg() {
            const msgInput = document.getElementById("msg");
            const text = msgInput.value.trim();
            if (!text) return;
            if (!conversationId) {
                alert("Hãy chọn một cuộc trò chuyện trước!");
                return;
            }

            addMessage(text, "user");
            msgInput.value = "";

            socket.emit("send_message", { conversationId, text });
        }

        // Khi click nút Figma
        document.getElementById("figmaBtn").addEventListener("click", async () => {
            if (!conversationId) {
                alert("❌ Vui lòng chọn một cuộc trò chuyện trước!");
                return;
            }

            try {
                const res = await axios.post(`http://localhost:8080/api/conversations/${conversationId}/figma-layout`);
                console.log("🎨 Figma layout response:", res.data);
                alert("✅ Layout Figma đã được tạo thành công! Kiểm tra console để xem JSON layout.");
            } catch (err) {
                console.error("❌ Lỗi khi tạo layout Figma:", err);
                alert("⚠️ Không thể tạo layout Figma!");
            }
        });

        // Nhận tin nhắn AI từ server
        socket.on("receive_message", (data) => {
            console.log("📩 Tin nhắn từ server:", data.text);
            addMessage(data.text, "system");
        });

        socket.on("error", (data) => {
            console.log("❌ Lỗi từ server:", data.message);
            alert(data.message);
        });

        // Khi tải trang
        window.onload = loadConversations;
    </script>
</body>

</html>
